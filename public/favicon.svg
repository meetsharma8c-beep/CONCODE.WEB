  <!-- Outer aura ring -->
  <circle cx="50" cy="50" r="42" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="120, 10"/>
  
  <!-- Fluid Top Arc -->
  <path d="M 16 50 C 30 20, 70 20, 84 50" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
