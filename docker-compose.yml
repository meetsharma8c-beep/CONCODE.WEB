services:
  concode-web:
    build: .
    container_name: concode-web-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - concode-db
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - NEURAL_BRAIN_URL=http://host.docker.internal:8000
      - MONGO_URI=mongodb://concode_admin:${MONGO_PASSWORD:-concode_secure_db_pw}@concode-db:27017/concode?authSource=admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./config:/app/config
      - ./utils:/app/utils
      - ./server.js:/app/server.js
      # Optional: Mount Obsidian Vault for emotional graph sync
      # - ${OBSIDIAN_VAULT_PATH:-./data/obsidian}:/data/obsidian-vault

  concode-db:
    image: mongo:6.0
    container_name: concode-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=concode_admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}

