apiVersion: v1
kind: Service
metadata:
  name: concode-web-service
  namespace: default
  labels:
    app: concode-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http-web
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http-preview
  selector:
    app: concode-web
