apiVersion: apps/v1
kind: Deployment
metadata:
  name: concode-web
  namespace: default
  labels:
    app: concode-web
    tier: frontend-gateway
    version: "5.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: concode-web
  template:
    metadata:
      labels:
        app: concode-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: concode-web
          image: concode-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
            - containerPort: 3001
              name: http-preview
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: concode-secrets
                  key: jwt-secret
            - name: ALLOWED_ORIGIN
              value: "https://concode.io"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: concode-secrets
                  key: mongo-uri
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: concode-secrets
                  key: gemini-api-key
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
