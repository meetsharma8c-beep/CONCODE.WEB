apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concode-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - concode.io
        - www.concode.io
      secretName: concode-tls-cert
  rules:
    - host: concode.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concode-web-service
                port:
                  number: 80
    - host: www.concode.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concode-web-service
                port:
                  number: 80
